apiVersion: apps/v1
kind: Deployment
metadata:
  name: rotas
  namespace: ops-lab
  labels:
    app: rotas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rotas
  template:
    metadata:
      labels:
        app: rotas
    spec:
      containers:
        - name: rotas
          image: rotas:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 500m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
